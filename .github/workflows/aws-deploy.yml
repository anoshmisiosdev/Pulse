name: Deploy backend to AWS

# Builds the backend image, pushes it to ECR, then *drives and verifies* the
# ECS Express Mode rollout.
#
# Previously drove App Runner. Migrated to ECS Express Mode (pulse-api-express)
# because App Runner stopped accepting new customers on this account and had
# become unreliable besides. Unlike App Runner, ECS never auto-deploys a new
# :latest image on its own — pushing one just sits in ECR until something
# tells the service to pick it up, so this still:
#
#   1. bakes the commit SHA into the image (Dockerfile APP_REVISION)
#   2. explicitly forces a new deployment instead of hoping something notices
#   3. waits for the rollout to reach a terminal state
#   4. polls /api/health until `revision` equals the SHA it just built
#
# Step 4 is the one that matters: it fails the job if the running container is
# still the old one. A full rollout (new task healthy + old task's ALB
# deregistration drain) takes ~10 minutes in practice — the wait step is sized
# for that, not for App Runner's faster in-place swap.
#
# Auth is OIDC (role pulse-github-deploy) — no AWS keys stored in GitHub. The
# role needs ECR push permissions plus ecs:UpdateService, ecs:DescribeServices
# and ecs:DescribeExpressGatewayService, scoped to the pulse-api-express
# service ARN.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/aws-deploy.yml"
  # Lets you redeploy the current main without an empty commit.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: 761018860175.dkr.ecr.us-east-1.amazonaws.com/pulse-api
  ECS_CLUSTER: default
  ECS_SERVICE: pulse-api-express
  ECS_SERVICE_ARN: arn:aws:ecs:us-east-1:761018860175:service/default/pulse-api-express

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::761018860175:role/pulse-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 \
            --build-arg "APP_REVISION=$SHA" \
            -t "$ECR_REPO:latest" -t "$ECR_REPO:$SHA" backend
          docker push "$ECR_REPO:latest"
          docker push "$ECR_REPO:$SHA"

      - name: Resolve the service endpoint
        run: |
          set -euo pipefail
          ENDPOINT=$(aws ecs describe-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --query "service.activeConfigurations[0].ingressPaths[0].endpoint" \
            --output text)
          if [ -z "$ENDPOINT" ] || [ "$ENDPOINT" = "None" ]; then
            echo "::error::Could not resolve the ECS Express service endpoint."
            echo "Check that ECS_SERVICE_ARN still points at a live service."
            exit 1
          fi
          echo "SERVICE_URL=https://$ENDPOINT" >> "$GITHUB_ENV"
          echo "Service:  $ECS_SERVICE_ARN"
          echo "Endpoint: https://$ENDPOINT"

      - name: Start the rollout
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment > /dev/null
          echo "Forced a new deployment of $ECS_SERVICE"

      - name: Wait for the rollout to finish
        run: |
          set -euo pipefail
          # No dedicated waiter for Express Mode rollouts, so poll the PRIMARY
          # deployment's rolloutState. Observed real duration ~10 min (new
          # task healthy, then the old task's 300s ALB deregistration drain) —
          # sized generously above that, same spirit as App Runner's ~15 min.
          for _ in $(seq 1 80); do   # up to ~20 min
            STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].deployments[?status=='PRIMARY'].rolloutState | [0]" \
              --output text)
            echo "rollout state: $STATUS"
            case "$STATUS" in
              COMPLETED) exit 0 ;;
              FAILED)
                echo "::error::Rollout of $ECS_SERVICE failed."
                echo "Check ECS → Clusters → $ECS_CLUSTER → $ECS_SERVICE → Logs for the task's traceback."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Rollout did not finish within 20 minutes."
          exit 1

      - name: Verify the running container is the code we just built
        run: |
          set -euo pipefail
          # The check that would have caught App Runner's week-long staleness:
          # compare the revision the live service reports against the SHA
          # built above.
          for _ in $(seq 1 20); do   # up to ~5 min for the new task to serve traffic
            BODY=$(curl -fsS --max-time 20 "${SERVICE_URL}/api/health" || echo '{}')
            LIVE=$(printf '%s' "$BODY" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("revision","")) ' 2>/dev/null || echo "")
            echo "live revision: '${LIVE}' (want '${SHA}')"
            if [ "$LIVE" = "$SHA" ]; then
              echo "Deployed and serving ${SHA}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Service is healthy but still reports revision '${LIVE}', not '${SHA}'."
          echo "The image was pushed but the running container was not replaced."
          exit 1
