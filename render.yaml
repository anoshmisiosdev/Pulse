# Render Blueprint for the Pulse backend (FastAPI + Celery + Redis).
# The frontend deploys separately on Vercel; Postgres is Supabase (external).
# Set the `sync: false` secrets in the Render dashboard after first apply.
services:
  - type: web
    name: pulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Bootstrap the base schema first: on a brand-new database, Alembic's
    # incremental ALTERs (from 20260709_0001 on) fail with UndefinedTableError
    # because create_all — normally run by app/main.py's lifespan — hasn't
    # run yet at preDeploy time (the app itself hasn't started).
    preDeployCommand: uv run python -m app.scripts.bootstrap_schema && uv run python -m app.scripts.migrate
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL # Supabase pooler URL (port 6543)
        sync: false
      - key: DATABASE_MIGRATION_URL # Supabase direct URL (port 5432)
        sync: false
      - key: DB_USE_PGBOUNCER
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET # only if your project uses HS256; else JWKS is used
        sync: false
      - key: EXTRA_CORS_ORIGINS # your Vercel domain, e.g. https://pulse.vercel.app
        sync: false
      - key: POSTHOG_PROJECT_TOKEN
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: VISITOR_ADMIN_EMAILS
        sync: false
      - key: RB2B_WEBHOOK_SECRET
        sync: false
      - key: RB2B_MONTHLY_COST_USD
        value: "0"
      - key: FERNET_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: SQUARE_APP_ID
        sync: false
      - key: SQUARE_APP_SECRET
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      - key: SQUARE_WEBHOOK_URL
        sync: false
      - key: PAYMENT_HISTORY_LOOKBACK_DAYS
        value: "730"
      - key: PAYMENT_SYNC_OVERLAP_MINUTES
        value: "10"
      - key: PAYMENT_SYNC_INTERVAL_SECONDS
        value: "900"
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: PRICING_PIPELINE_V2_ENABLED
        value: "true"
      - key: PRICING_MONITORING_ENABLED
        value: "false"
      - key: PRICING_DAILY_FRESH_RUN_LIMIT
        value: "10"
      - key: PRICING_MAX_PROVIDER_COST_USD
        value: "0.10"
      - key: PRICING_MAX_COMPETITORS_PER_RUN
        value: "4"
      - key: PRICING_MAX_AI_FALLBACKS_PER_RUN
        value: "2"
      - key: PRICING_MAX_CONTENT_FALLBACKS_PER_RUN
        value: "1"
      - key: PRICING_MAX_GEOCODING_REQUESTS_PER_RUN
        value: "1"
      - key: PRICING_GOOGLE_PLACE_DETAILS_ENABLED
        value: "false"
      - key: TOKEN_ROUTER_API_KEY
        sync: false
      - key: TOKEN_ROUTER_BASE_URL
        sync: false
      - key: TOKEN_ROUTER_MODEL
        value: claude-sonnet-4-6
      - key: REDIS_URL
        fromService: { type: keyvalue, name: pulse-redis, property: connectionString }
      - key: CELERY_BROKER_URL
        fromService: { type: keyvalue, name: pulse-redis, property: connectionString }
      - key: CELERY_RESULT_BACKEND
        fromService: { type: keyvalue, name: pulse-redis, property: connectionString }

  - type: worker
    name: pulse-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uv run celery -A app.workers.celery_app.celery worker --beat --loglevel=info
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_USE_PGBOUNCER
        value: "true"
      - key: FERNET_KEY
        sync: false
      - key: SQUARE_APP_ID
        sync: false
      - key: SQUARE_APP_SECRET
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: PAYMENT_HISTORY_LOOKBACK_DAYS
        value: "730"
      - key: PAYMENT_SYNC_OVERLAP_MINUTES
        value: "10"
      - key: PAYMENT_SYNC_INTERVAL_SECONDS
        value: "900"
      - key: TOKEN_ROUTER_API_KEY
        sync: false
      - key: TOKEN_ROUTER_BASE_URL
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: pulse-redis, property: connectionString }
      - key: CELERY_BROKER_URL
        fromService: { type: keyvalue, name: pulse-redis, property: connectionString }
      - key: CELERY_RESULT_BACKEND
        fromService: { type: keyvalue, name: pulse-redis, property: connectionString }

  - type: keyvalue
    name: pulse-redis
    plan: starter
    ipAllowList: [] # only reachable from Render services
